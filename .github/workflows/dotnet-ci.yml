name: OpenAlex .NET CI

on:
  workflow_dispatch:
  pull_request:
    branches: [ main, 'release/**', 'feature/som-faculty-roster-import-*', 'feature/som-faculty-roster-pages-*' ]
  push:
    branches: [ main, 'feature/uva-theme-navigation-*' ]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore OpenAlexFacultyPublications.sln
      - name: Build
        run: dotnet build OpenAlexFacultyPublications.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/OpenAlex.Tests/OpenAlex.Tests.csproj --configuration Release --verbosity normal

  frontend-navigation:
    runs-on: ubuntu-latest
    env:
      UI_CHECK_OUTPUT: ${{ github.workspace }}/.artifacts/uva-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser checks
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check responsive navigation
        run: node tests/ui/check-navigation.mjs
      - name: Save frontend previews and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uva-navigation-previews
          path: ${{ env.UI_CHECK_OUTPUT }}
          if-no-files-found: ignore
