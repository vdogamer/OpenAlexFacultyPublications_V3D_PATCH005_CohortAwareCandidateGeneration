name: OpenAlex .NET CI

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Enable long paths
        run: git config --system core.longpaths true
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore OpenAlexFacultyPublications.sln
      - name: Build
        run: dotnet build OpenAlexFacultyPublications.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/OpenAlex.Tests/OpenAlex.Tests.csproj --configuration Release --verbosity normal
